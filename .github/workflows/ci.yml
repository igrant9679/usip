name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref so a newer push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + tests
    # Pinned rather than `ubuntu-latest`: that label begins migrating to
    # Ubuntu 26 on 19 Oct 2026, which would move this build underneath us.
    # 24.04 is what `ubuntu-latest` already resolved to when this was pinned
    # (image ubuntu24/20260907.300), so the pin changed nothing on the day.
    # Bump it deliberately, with a run to prove it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Match railway.toml ([deploy] runs on Node 20) and .node-version.
    # This is the Node the APP is built and tested on. It is unrelated to
    # the Node the actions themselves run on -- those are pinned to majors
    # whose runtime is node24, because the runner deprecated node20 for
    # action code. Bumping this to 24 would break parity with production.
    env:
      NODE_VERSION: "20"
      # Required by tests that probe env-dependent code paths.
      NODE_ENV: test
      # Stub out env vars that some tests/imports read at module load time.
      # Real values aren't needed because tests mock external services and
      # the in-memory rate limiter skips when NODE_ENV=test.
      JWT_SECRET: ci-stub-jwt-secret
      DATABASE_URL: mysql://stub:stub@localhost:3306/stub
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      ENCRYPTION_KEY: ci-stub-encryption-key-must-be-non-empty
      UNIPILE_API_KEY: ci-stub-unipile-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version is read from package.json's `packageManager` field —
          # passing `version:` here would conflict with that source.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck runs but is intentionally non-blocking. The codebase has
      # a baseline of latent type errors (extensive UI/schema drift); 40+
      # were cleared in the initial cleanup pass, the rest are accepted as
      # the working baseline. Annotations remain visible on every run so
      # new errors surface in the PR review UI alongside the existing
      # ones — devs are expected to fix any annotation they introduce or
      # that lands in code they touch.
      #
      # To upgrade to strict mode later: drop continue-on-error and clear
      # the remaining baseline annotations in a dedicated cleanup PR.
      - name: Typecheck
        run: pnpm check
        continue-on-error: true

      # Tests are strictly blocking — runtime regressions should fail CI.
      # `if: always()` ensures tests run even if typecheck errored.
      - name: Tests
        if: always()
        run: pnpm test
