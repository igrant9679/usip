<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Velocity &mdash; Unified Revenue Intelligence</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="description" content="Velocity — The Unified Revenue Intelligence Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Analytics loads ONLY when the endpoint was configured at build time.
      // The static tag shipped the literal "%VITE_ANALYTICS_ENDPOINT%" when
      // the env var was unset, so every page load requested a garbage URL
      // and logged a 502 (found live, 2026-09-20).
      (function () {
        var ep = "%VITE_ANALYTICS_ENDPOINT%";
        var id = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!ep || ep.indexOf("%") !== -1) return;
        // Pages whose URL is a credential (a proposal or meeting link, a
        // reset, invite, join or email-confirm token) are never reported,
        // and no URL is reported with its query string or fragment (audit
        // 2026-10-20, G45). Umami recorded the full URL, token and all.
        var TOKEN_PAGE = /^\/(p|m)\/[^/]+|^\/(reset-password|invite\/accept|join|confirm-email)(\/|$)/;
        var pathOf = function (u) {
          try { return new URL(u, location.origin).pathname; } catch (e) { return ""; }
        };
        var bare = function (u) { return String(u).split(/[?#]/)[0]; };
        if (TOKEN_PAGE.test(location.pathname)) return;
        window.__velocityAnalyticsBeforeSend = function (type, payload) {
          if (!payload) return payload;
          if (payload.url && TOKEN_PAGE.test(pathOf(payload.url))) return false;
          if (payload.url) payload.url = bare(payload.url);
          if (payload.referrer) payload.referrer = TOKEN_PAGE.test(pathOf(payload.referrer)) ? "" : bare(payload.referrer);
          return payload;
        };
        var s = document.createElement("script");
        s.defer = true;
        s.src = ep + "/umami";
        s.setAttribute("data-website-id", id.indexOf("%") === -1 ? id : "");
        s.setAttribute("data-exclude-search", "true");
        s.setAttribute("data-exclude-hash", "true");
        s.setAttribute("data-before-send", "__velocityAnalyticsBeforeSend");
        document.body.appendChild(s);
      })();
    </script>
  </body>

</html>
