<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Velocity &mdash; Unified Revenue Intelligence</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="description" content="Velocity — The Unified Revenue Intelligence Platform" />
    <script>
      // Inter and JetBrains Mono come from Google Fonts for the signed-in app
      // only. A public page (booking /b, form /f, landing page /l, proposal /p,
      // meeting pick /m, chat /c) uses the system font stack that --font-sans
      // already falls back to: loading from Google sent every visitor's IP
      // address to Google (audit L14, X2.7). No self-hosted font package could
      // be installed offline, so this is the conservative choice; self-hosting
      // the files would let every page use Inter again.
      (function () {
        if (/^\/(b|f|l|p|m|c)\//.test(location.pathname)) return;
        var head = document.head;
        var add = function (rel, href, cross) {
          var l = document.createElement("link");
          l.rel = rel;
          l.href = href;
          if (cross) l.crossOrigin = "";
          head.appendChild(l);
        };
        add("preconnect", "https://fonts.googleapis.com");
        add("preconnect", "https://fonts.gstatic.com", true);
        add("stylesheet", "https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Analytics loads ONLY when the endpoint was configured at build time.
      // The static tag shipped the literal "%VITE_ANALYTICS_ENDPOINT%" when
      // the env var was unset, so every page load requested a garbage URL
      // and logged a 502 (found live, 2026-09-20).
      (function () {
        var ep = "%VITE_ANALYTICS_ENDPOINT%";
        var id = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!ep || ep.indexOf("%") !== -1) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = ep + "/umami";
        s.setAttribute("data-website-id", id.indexOf("%") === -1 ? id : "");
        document.body.appendChild(s);
      })();
    </script>
  </body>

</html>
